[package]
name = "lee"
version = "0.1.0"
edition = "2024"
default-run = "lee"
description = "Locate Exact Elements — Local token-saving MCP server, AST code & Markdown indexer, output digest engine, and SQLite FTS5 memory store for AI coding agents."
license = "MIT"

[[bin]]
name = "lee"
path = "src/main.rs"

[dependencies]
# CLI & Serialization
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Local Database (Bundled SQLite includes FTS5 extension by default)
rusqlite = { version = "0.43", features = ["bundled"] }

# Fast Hashing & Parallel File Walker (ripgrep engine)
blake3 = "1.8"
ignore = "0.4"
globset = "0.4"
regex = "1.13"

# Multi-Language AST Code Indexing
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"

# System Config Directory Utilities
dirs = "7.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
